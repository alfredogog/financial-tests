name: Financial Tests CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  workflow_dispatch:

jobs:
  build-api-tests:
    name: Build API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore financial-tests.sln

      - name: Build solution
        run: dotnet build financial-tests.sln --configuration Release --no-restore

      - name: List API tests
        run: dotnet test financial-tests.sln --configuration Release --no-build --list-tests

  validate-e2e-tests:
    name: Validate Playwright Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: List Playwright tests
        run: npx playwright test --list