name: Financial Tests CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  workflow_dispatch:

env:
  API_BASE_URL: http://127.0.0.1:5000/api/v1
  E2E_BASE_URL: http://127.0.0.1:5173

jobs:
  api-tests:
    name: API Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore financial-tests.sln

      - name: Build solution
        run: dotnet build financial-tests.sln --configuration Release --no-restore

      - name: Start Mock API
        run: |
          dotnet run \
            --project mock-api/FinancialMockApi.csproj \
            --configuration Release \
            --no-build \
            --urls http://127.0.0.1:5000 \
            > mock-api.log 2>&1 &

          echo $! > mock-api.pid

      - name: Wait for Mock API
        run: |
          echo "Waiting for Mock API..."

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              echo "Mock API is ready."
              exit 0
            fi

            echo "Attempt $i/30 - API not ready yet..."
            sleep 2
          done

          echo "Mock API did not become ready."
          cat mock-api.log
          exit 1

      - name: Run API regression tests
        run: >
          dotnet test financial-tests.sln
          --configuration Release
          --no-build
          --filter "Category!=KnownIssue"
          --logger "trx;LogFileName=api-regression-tests.trx"
          --results-directory TestResults
          --logger "console;verbosity=normal"

      - name: List known issues
        if: always()
        run: >
          dotnet test financial-tests.sln
          --configuration Release
          --no-build
          --filter "Category=KnownIssue"
          --list-tests

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-test-results
          path: TestResults/
          retention-days: 14

      - name: Show Mock API logs on failure
        if: failure()
        run: cat mock-api.log

  validate-e2e-tests:
    name: Validate Playwright Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: List Playwright tests
        run: npx playwright test --list